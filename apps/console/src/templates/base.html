<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pipeline Console{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --ink: #1a1f24;
      --muted: #5c6770;
      --line: #d8dee4;
      --accent: #0b6e4f;
      --accent-soft: #e6f4ef;
      --warn: #8a5a00;
      --warn-bg: #fff6e5;
      --danger: #9b1c1c;
      --mono: "Cascadia Code", "Consolas", "Courier New", monospace;
      --sans: "Segoe UI", "Malgun Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 10% -10%, #dceee6 0%, transparent 55%),
        linear-gradient(180deg, #eef2f5 0%, var(--bg) 40%);
      min-height: 100vh;
    }
    header {
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 1rem 1.25rem; }
    header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .brand { font-weight: 700; letter-spacing: -0.02em; }
    .brand span { color: var(--accent); }
    .member { color: var(--muted); font-size: 0.9rem; }
    nav { display: flex; gap: 0.4rem; flex-wrap: wrap; margin: 1rem 0 1.25rem; }
    nav a {
      text-decoration: none;
      color: var(--ink);
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-size: 0.92rem;
    }
    nav a.active, nav a:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.1rem 1.2rem;
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.35rem; margin: 0 0 0.35rem; }
    .lead { color: var(--muted); margin: 0 0 1rem; line-height: 1.45; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.25rem; }
    input, select, textarea {
      width: 100%;
      padding: 0.55rem 0.65rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      margin-bottom: 0.85rem;
      background: #fff;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 700px) { .row { grid-template-columns: 1fr; } }
    .actions { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
    button, .btn {
      border: none;
      background: var(--accent);
      color: #fff;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .hint {
      font-size: 0.85rem;
      color: var(--warn);
      background: var(--warn-bg);
      border: 1px solid #f0d9a0;
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      margin: 0 0 1rem;
    }
    .summary { font-size: 0.95rem; line-height: 1.5; }
    .summary code { font-family: var(--mono); font-size: 0.85rem; }
    .log {
      font-family: var(--mono);
      font-size: 0.8rem;
      background: #111827;
      color: #e5e7eb;
      border-radius: 8px;
      padding: 0.85rem;
      min-height: 12rem;
      max-height: 28rem;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .status-pill {
      display: inline-block;
      font-size: 0.8rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #f8fafc;
    }
    .status-pill.running { background: #e0f2fe; border-color: #7dd3fc; }
    .status-pill.succeeded { background: var(--accent-soft); border-color: #86efac; }
    .status-pill.failed { background: #fee2e2; border-color: #fca5a5; color: var(--danger); }
    .error { color: var(--danger); font-size: 0.9rem; }
    footer { color: var(--muted); font-size: 0.8rem; padding: 1.5rem 0 2rem; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">Kurly Pipeline <span>Console</span></div>
      <div class="member">BATCH_MEMBER={{ batch_member }}</div>
    </div>
  </header>
  <main class="wrap">
    <nav>
      <a href="/" class="{% if active_step == 'home' %}active{% endif %}">홈</a>
      <a href="/steps/discover" class="{% if active_step == 'discover' %}active{% endif %}">1. 발견</a>
      <a href="/steps/collect" class="{% if active_step == 'collect' %}active{% endif %}">2. 상세</a>
      <a href="/steps/classify" class="{% if active_step == 'classify' %}active{% endif %}">2.5 판별</a>
      <a href="/steps/ocr" class="{% if active_step == 'ocr' %}active{% endif %}">3. OCR</a>
    </nav>
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap">
    기존 Docker CLI를 호출합니다. 동시에 하나의 작업만 실행됩니다.
  </footer>
</body>
</html>
