name: kurly-freshness-pipeline

services:
  console:
    build:
      context: .
      dockerfile: docker/console.Dockerfile
    env_file:
      - .env
    environment:
      CONSOLE_PROJECT_ROOT: /workspace
      COMPOSE_PROJECT_NAME: kurly-freshness-pipeline
      # Host path for nested `docker compose run` volume resolution (set by start_console.py)
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:-}
      COMPOSE_FILE_PATH: /workspace/compose.yaml
    ports:
      - "${CONSOLE_PORT:-8787}:8787"
    volumes:
      - ./:/workspace
      - ./apps/console/src:/app/src
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    command:
      [
        "uvicorn",
        "src.main:app",
        "--app-dir",
        "/app",
        "--host",
        "0.0.0.0",
        "--port",
        "8787",
        "--reload",
      ]

  crawler:
    build:
      context: .
      dockerfile: docker/crawler.Dockerfile
    env_file:
      - .env
    volumes:
      - ./apps/crawler/src:/app/src
      - ./datasets:/data
      - ./tests:/app/tests:ro
    init: true
    # Playwright needs shared memory; keep modest defaults for laptops.
    shm_size: "${CRAWLER_SHM_SIZE:-512m}"
    mem_limit: "${CRAWLER_MEMORY_LIMIT:-2g}"
    command: ["python", "-m", "src.cli", "health"]

  ocr-parser:
    build:
      context: .
      dockerfile: docker/ocr-parser.Dockerfile
    shm_size: "${OCR_SHM_SIZE:-1g}"
    mem_limit: "${OCR_MEMORY_LIMIT:-3g}"
    platform: linux/amd64
    env_file:
      - .env
    volumes:
      - ./apps/ocr-parser/src:/app/src
      - ./contracts:/app/contracts:ro
      - ./datasets:/data
      - ./outcome:/outcome
      - ./tests:/app/tests:ro
    command: ["python", "-m", "src.cli", "health"]

  normalizer:
    build:
      context: .
      dockerfile: docker/normalizer.Dockerfile
    env_file:
      - .env
    volumes:
      - ./apps/normalizer/src:/app/src
      - ./contracts:/app/contracts:ro
      - ./datasets:/data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "src.cli", "health"]

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freshness}
      POSTGRES_USER: ${POSTGRES_USER:-freshness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-freshness} -d ${POSTGRES_DB:-freshness}
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
